<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto Matemático</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header" id="game-header" hidden>
      <div class="progress">
        <span id="progress-label">Pregunta 1 de 4</span>
        <div class="progress__bar">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
      </div>
      <div class="stats">
        <div class="stats__score" id="score-label">Puntos: 0</div>
        <div class="stats__lives" id="lives-label" aria-label="Vidas restantes">
          <span class="heart" data-life="1">❤</span>
          <span class="heart" data-life="2">❤</span>
          <span class="heart" data-life="3">❤</span>
        </div>
      </div>
    </header>

    <section class="card card--login" id="login-screen">
      <p class="map__brand">Dou Matemático</p>
      <h1 class="map__title">Inicia sesión</h1>
      <form id="login-form" class="login-form">
        <label class="login-form__field">
          <span>Usuario</span>
          <input type="text" id="login-username" name="username" autocomplete="username" required>
        </label>
        <label class="login-form__field">
          <span>Contraseña</span>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </label>
        <p class="login-form__error" id="login-error" hidden></p>
        <button class="btn btn--primary" type="submit" id="login-submit-btn">Entrar</button>
      </form>
      <p class="login-hint">Usuario de prueba: <strong>Testor</strong> / <strong>7654321</strong></p>
    </section>

    <section class="card card--map" id="map-screen" hidden>
      <div class="map__topbar">
        <span id="map-user-label">Hola</span>
        <button class="btn btn--link" id="logout-btn" type="button">Cerrar sesión</button>
      </div>
      <p class="map__brand">Dou Matemático</p>
      <h1 class="map__title">Mapa del Reto Matemático</h1>
      <p class="map__subtitle" id="map-subtitle">0 de 5 categorías completadas</p>
      <div class="map__path" id="map-path"></div>
      <button class="btn btn--secondary" id="map-restart-btn">Reiniciar todo</button>
    </section>

    <section class="card" id="question-screen" hidden>
      <p class="card__category" id="question-category-label">Sumas</p>
      <h1 class="card__question" id="question-text">Cargando pregunta…</h1>
      <div class="options" id="options-container"></div>
      <p class="feedback" id="feedback-text" hidden></p>
      <button class="btn btn--primary" id="continue-btn" hidden>Continuar</button>
    </section>

    <section class="card card--result" id="result-screen" hidden>
      <h1 class="result__title" id="result-title">¡Reto terminado!</h1>
      <p class="result__stat" id="result-score">Aciertos: 0 de 20</p>
      <p class="result__stat" id="result-percentage">Porcentaje: 0%</p>
      <p class="result__message" id="result-message"></p>
      <button class="btn btn--primary" id="restart-btn">Reiniciar todo</button>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

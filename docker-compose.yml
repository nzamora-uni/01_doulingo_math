services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: retomatematico_root
      MYSQL_DATABASE: retomatematico
      MYSQL_USER: retomatematico
      MYSQL_PASSWORD: retomatematico
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pretomatematico_root"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
